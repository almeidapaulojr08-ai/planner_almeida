name: Relatório FinançasCasal

on:
  schedule:
    # Horário em UTC. Brasília = UTC-3, então 11:00 UTC = 08:00 BRT.
    - cron: '0 11 * * *'   # TODO DIA às 08:00 BRT
    - cron: '0 23 * * *'   # TODO DIA às 20:00 BRT
  workflow_dispatch:        # botão "Run workflow" para disparar na hora

jobs:
  enviar-relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: reports
        run: npm install

      - name: Enviar relatório
        working-directory: reports
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: node send_report.js
